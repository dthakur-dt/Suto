name: Build APK - Suto Full Monitoring

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "telegram.bot.token=${{ secrets.BOT_TOKEN || 'test_token' }}" >> local.properties
          echo "telegram.chat.id=289240360" >> local.properties
          echo "github.pat=dummy" >> local.properties
          echo "firebase.url=https://sutoapp-e155c-default-rtdb.firebaseio.com/app_features.json" >> local.properties
          cat local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew || echo "No gradlew, will use gradle"

      - name: Build with Gradle Wrapper (if available) or Gradle
        run: |
          # If wrapper jar missing, generate it
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper --gradle-version 8.4 || echo "Wrapper generation failed, trying direct build"
          fi
          
          # Try wrapper first, then gradle
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --stacktrace || gradle assembleDebug
          else
            echo "Using gradle directly..."
            gradle assembleDebug --stacktrace || ./gradlew assembleDebug
          fi

      - name: List APKs
        run: |
          find app/build -name "*.apk" -type f
          ls -lh app/build/outputs/apk/debug/ || ls -lh app/build/outputs/apk/ || find . -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suto-APK-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/*.apk
            **/*.apk
          if-no-files-found: warn

      - name: Create Release with APK (on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: "Suto Build #${{ github.run_number }} - Full Monitoring"
          body: |
            📱 Suto Full Monitoring APK - Auto Build from WebApp
            
            Features:
            - Location + Battery + Mobile Number
            - Battery History Graph
            - Location History Map
            - Remote Ring / Find My Phone
            - Device Health (RAM/Storage/WiFi)
            - SOS Panic Alert
            - Notification Forward
            
            Built via Telegram WebApp Console Build Button
            Commit: ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with Build Status
        run: |
          echo "✅ Build completed at $(date)" >> $GITHUB_STEP_SUMMARY
          echo "📱 APK should be in Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "💻 Console: https://dthakur-dt.github.io/Suto/" >> $GITHUB_STEP_SUMMARY
